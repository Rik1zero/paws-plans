<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заголовок страницы</title>
    <link rel="stylesheet" href="../style/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">


  </head>
  <body>

  <div class="main inline">
    <div class="mainFrame vert ">

      <div class="catBar green ">
        <div><img class="catPhoto" src="https://img.freepik.com/free-photo/beautiful-kitten-with-colorful-clouds_23-2150752964.jpg" alt="Человек и пароход"></div>
        <div class="informationBlock vert">
          <div class ="level">
            <div class="roboto-bold font-white ">Уровень 2</div>
            <div class="level-bar">
                <div class="green-part light-green roboto-bold">100</div>
            </div>
            <div class="inline">
              <div class="roboto-bold font-white ">0</div>
              <div class="roboto-bold font-white ml-auto ">800</div>
            </div>
          </div>
          <div class="mood">
            <div class="roboto-bold font-white">настроение:</div>
            <div class="mood-bar">
              <div class="roboto-bold font-white ">65%</div>
             <div class="level-mood-bar">
                <div class="procent-mood orange roboto-bold"></div>
             </div>
          </div>
            </div>
          <div class="coinline mt-10">
          <div class="coin-icon baseline"></div>
            <div class="roboto-bold font-white  baseline">15</div>
            <button class="button roboto-bold ml-auto">магазин</button>
          </div>
        </div>
      </div>
      <div class="activitiesBar light-blue">
        Количество задач: 3

      <div class="activities-task roboto-bold">
        <div> дз по физике</div>
        <div class="activities-check ml-auto">
          <div class="activities-checkBox green">
              <div class="z-index-99 text-center mt-2 roboto-bold font-dark-grey">12</div>
          </div>
        </div>
        </div>
  <div class="activities-task roboto-bold">
  <div class="activities-check">
  <div class="activities-checkBox-negative ">
        <div class="z-index-99 text-center mt-2 roboto-bold font-dark-grey">12</div>
  </div>

  </div>
      <div class="ml-auto"> дз по физике</div>
  </div>

        <div class="activities-task roboto-bold">
        <div> дз по физике</div>
            <div class="activities-check ml-auto">
          <div class="activities-checkBox-">
          </div>
        </div>
        </div>
        <div class="activities-task-negative roboto-bold">
        <div> дз по физике</div>
        <div class="activities-check ml-auto">
          <div class="activities-checkBox-greenMark">
              <div class="greenMark-icon"></div>
          </div>
        </div>
        </div>
          <div class="activities-task roboto-bold">
            <div class="activities-specifications vertical">
              <p> посуду</p><br/>
                <p class="roboto-regular">
                    1д 17ч 12м
                </p>
            </div>
              <div class="activities-check ml-auto">
                  <div class="activities-checkBox-"></div>
              </div>
          </div>
          <div class="add-activities"></div>
        <div class="create-task roboto-bold">
            <div class="horizontal-center">создать задачу</div>
            <form>
    <input placeholder="Введите текст" class="form-txt"type="text" name="name" id="name" required />
            </form>
            <div class="horizontal-center">
                <button class="button-confirm">Подтвердить</button>
                <button class="button-cancel">Отменить</button>
            </div>

            <div class="horizontal-center">создать привычку</div>
            <form>
    <input placeholder="Введите текст" class="form-txt"type="text" name="name" id="name" required />
            </form>
            <div class="horizontal-center">
                <button class="button-or">положительная</button>
                <button class="button-or">негативная</button>
            </div>
            <div class="horizontal-center">
                <button class="button-confirm">Подтвердить</button>
                <button class="button-cancel">Отменить</button>
            </div>

            <div class="horizontal-center">создать дейлик</div>
            <form>
    <input placeholder="Введите текст" class="form-txt"type="text" name="name" id="name" required />
            </form>
            <div class="horizontal-center">
                выполняется раз в <button class="">день</button>
            </div>
            <div class="horizontal-center">
                <button class="button-confirm">Подтвердить</button>
                <button class="button-cancel">Отменить</button>
            </div>

        </div>
      </div>
      <div class="menu ">
        <div class="type-button roboto-bold">
            <div class="task-icon"> </div>
            задачи
        </div>
          <div class="marker-button roboto-bold">
              <div class ="invert dayleak-icon"></div>
              дейлики
          </div>
          <div class="type-button roboto-bold">
              <div class="habit-icon"></div>
              привычки
          </div>
          <div class="type-button roboto-bold">
              <div class="settings-icon"></div>
              настройки

          </div>

      </div>
    </div>
    </div>
  </body>
</html>
